<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snow chunk integration check</title>
<style>body{margin:0}#map{width:390px;height:844px;background:#eee}#layers{position:fixed;top:0;right:0;background:white}#snow-season-readout{position:fixed;bottom:0;background:white}</style>
<script type="importmap">{"imports":{"ol/":"https://esm.sh/ol@10.6.1/","proj4":"https://esm.sh/proj4@2.19.10"}}</script>
<div id="map"></div><div id="layers"></div><select id="projection"></select>
<script type="module">
import Map from 'ol/Map.js';import View from 'ol/View.js';import proj4 from 'proj4';import {register} from 'ol/proj/proj4.js';import {SnowSeasonLayer} from '../src/map/layers/snow-season.js';
proj4.defs('EPSG:32633','+proj=utm +zone=33 +datum=WGS84 +units=m +no_defs');register(proj4);
window.map=new Map({target:'map',view:new View({projection:'EPSG:32633',center:[-24500,7949500],resolution:2})});window.snow=new SnowSeasonLayer(window.map);
</script>
